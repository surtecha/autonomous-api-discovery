[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-api-discovery"
version = "0.1.0"
description = "Evidence-driven discovery of authorized disposable HTTP APIs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "langgraph>=0.3,<2",
  "langgraph-checkpoint-sqlite>=2,<4", "openai>=1.65,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5", "openapi-spec-validator>=0.7,<1",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6.125,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "bandit>=1.8,<2", "pip-audit>=2.8,<3", "detect-secrets>=1.5,<2", "build>=1.2,<2", "types-jsonschema", "pre-commit>=4,<5"]
[tool.setuptools.packages.find]
include = ["packages*", "apps*"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
