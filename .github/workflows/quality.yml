name: Quality and security
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: discovery
          POSTGRES_USER: discovery
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discovery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://discovery@localhost:5432/discovery
      BACKEND_API_TOKEN: ci-synthetic-token-not-valid-outside-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock && .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/ruff check packages apps/api scripts tests targets
      - run: .venv/bin/mypy packages apps/api
      - run: .venv/bin/alembic upgrade head
      - run: .venv/bin/pytest -q
      - run: .venv/bin/bandit -r packages apps/api -ll
      - run: .venv/bin/pip-audit
      - run: .venv/bin/python scripts/security_scan.py
      - name: Detect secrets
        run: |
          .venv/bin/detect-secrets scan --all-files --exclude-files '(^|/)(node_modules|\.next|\.runtime|\.git|\.venv|\.mypy_cache|\.pytest_cache|\.ruff_cache|__pycache__)/|\.tsbuildinfo$|package-lock\.json|requirements(-dev|-validator)?\.lock' > /tmp/secrets.json
          .venv/bin/python -c "import json; assert not json.load(open('/tmp/secrets.json'))['results']"
      - name: Scan Git history
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -f infrastructure/docker/api.Dockerfile -t api-discovery-api:local .
      - run: docker build -f infrastructure/docker/target.Dockerfile -t api-discovery-target:local .
      - run: docker build -f infrastructure/docker/validator.Dockerfile -t api-discovery-validator:local .
      - run: RUN_SANDBOX_TESTS=1 python -m unittest discover -s tests -p test_container.py -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock && .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Generate and validate fixture SDKs
        run: |
          .venv/bin/python -m scripts.fixture_diagnostics
          for artifact in experiments/reports/fixture-diagnostics/*/*/sdk; do
            .venv/bin/python -m scripts.test_sandbox "$artifact"
          done
      - name: Live generated-client workflows in networkless containers
        run: .venv/bin/python -m scripts.live_sdk
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-disposable-database-value # pragma: allowlist secret - disposable CI credential
      BACKEND_API_TOKEN: ci-synthetic-token-not-valid-outside-tests
      WEB_USERNAME: ci-operator
      WEB_PASSWORD: ci-disposable-web-value # pragma: allowlist secret - disposable CI credential
      E2E_EXTERNAL_SERVER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d
      - name: Wait for authenticated services
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent -H "Authorization: Bearer $BACKEND_API_TOKEN" http://127.0.0.1:8000/api/v1/readiness >/dev/null && curl --fail --silent -u "$WEB_USERNAME:$WEB_PASSWORD" http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose down
